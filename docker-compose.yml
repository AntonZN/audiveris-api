services:
  # Одноразовый сервис миграций: гоняет `alembic upgrade head` и выходит.
  # API стартует только после его успешного завершения (см. depends_on ниже).
  migrate:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/srv/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://catalog:catalog@postgres:5432/catalog}
    command: ["alembic", "-c", "api/alembic.ini", "upgrade", "head"]
    restart: "no"
    networks:
      - audiveris

  audiveris-api:
    build:
      context: .
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000"
    volumes:
      - ./api:/srv/api
      - ./scripts:/srv/scripts
      - storage:/storage
    environment:
      DEBUG: ${DEBUG:-false}
      INPUT_DIR: ${INPUT_DIR}
      OUTPUT_DIR: ${OUTPUT_DIR}
      MIN_INTERLINE: ${MIN_INTERLINE}
      TESSDATA_PREFIX: ${TESSDATA_PREFIX:-/opt/tessdata}
      JAVA_OPTS: ${JAVA_OPTS}
      TASK_WORKERS: ${TASK_WORKERS}
      REDIS_URL: ${REDIS_URL}
      MEDIA_ROOT: ${MEDIA_ROOT}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL}
      MEDIA_PATH_PREFIX: ${MEDIA_PATH_PREFIX}
      API_TOKEN: ${API_TOKEN}
      PROCESSING_TIMEOUT_PER_FILE_SECONDS: ${PROCESSING_TIMEOUT_PER_FILE_SECONDS:-60}
      MIN_RECOGNIZED_NOTES: ${MIN_RECOGNIZED_NOTES:-3}
      PDF_RENDER_DPI: ${PDF_RENDER_DPI:-300}
      PDF_MAX_PIXELS: ${PDF_MAX_PIXELS:-18000000}
      IMAGE_MIN_DIMENSION: ${IMAGE_MIN_DIMENSION:-1000}
      IMAGE_UPSCALE_FACTOR: ${IMAGE_UPSCALE_FACTOR:-2.0}
      IMAGE_CONTRAST_FACTOR: ${IMAGE_CONTRAST_FACTOR:-1.2}
      IMAGE_SHARPNESS_FACTOR: ${IMAGE_SHARPNESS_FACTOR:-1.5}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://catalog:catalog@postgres:5432/catalog}
      CATALOG_MEDIA_DIR: ${CATALOG_MEDIA_DIR:-/storage/out/catalog}
      AUDIO_PREVIEW_DURATION_SECONDS: ${AUDIO_PREVIEW_DURATION_SECONDS:-20}
      AUDIO_PREVIEW_BITRATE_KBPS: ${AUDIO_PREVIEW_BITRATE_KBPS:-128}
      AUDIO_PREVIEW_SAMPLE_RATE: ${AUDIO_PREVIEW_SAMPLE_RATE:-44100}
      AUDIO_PREVIEW_FADE_OUT_SECONDS: ${AUDIO_PREVIEW_FADE_OUT_SECONDS:-1.5}
      AUDIO_PREVIEW_LOUDNESS_LUFS: ${AUDIO_PREVIEW_LOUDNESS_LUFS:--16}
      AUDIO_PREVIEW_TIMEOUT_SECONDS: ${AUDIO_PREVIEW_TIMEOUT_SECONDS:-120}
      AUDIO_PREVIEW_SOUNDFONT_PATH: ${AUDIO_PREVIEW_SOUNDFONT_PATH:-/usr/share/sounds/sf2/FluidR3_GM.sf2}
      AUDIO_PREVIEW_FLUIDSYNTH_CMD: ${AUDIO_PREVIEW_FLUIDSYNTH_CMD:-fluidsynth}
      AUDIO_PREVIEW_FFMPEG_CMD: ${AUDIO_PREVIEW_FFMPEG_CMD:-ffmpeg}
      FAILURES_DIR: ${FAILURES_DIR:-/storage/out/failures}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_SECRET: ${ADMIN_SECRET:-change-me-in-production}
    # --proxy-headers + --forwarded-allow-ips=*: доверять X-Forwarded-Proto от
    # Caddy (он в docker-сети, не 127.0.0.1), иначе https-схема теряется.
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--proxy-headers", "--forwarded-allow-ips=*"]

    networks:
      - audiveris

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalog}
      POSTGRES_DB: ${POSTGRES_DB:-catalog}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catalog} -d ${POSTGRES_DB:-catalog}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - audiveris

  redis:
    image: redis:7.4
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - audiveris

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      audiveris-api:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - storage:/storage:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - audiveris

volumes:
  storage:
  caddy_data:
  caddy_config:
  pgdata:

networks:
  audiveris:

[project]
name = "audiveris"
version = "0.1.0"
description = ""
authors = [
    {name = "anton",email = "pandarado@gmail.com"}
]
readme = "README.md"
# Верхняя граница 3.13 — её требует homr (фото-OMR), который не поддерживает 3.13+.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "python-multipart (>=0.0.21,<0.0.22)",
    "watchfiles (>=1.1.1,<2.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "pypdf (>=5.0.0,<6.0.0)",
    "cryptography (>=44.0.0,<45.0.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "music21 (>=10.3.0,<11.0.0)",
    "numpy (>=2.2.6,<3.0)",
    "opencv-python-headless (>=4.12,<5.0)",
    "verovio (>=6.2,<7.0)",
    "homr (==0.6.2)",
    "alembic (>=1.14.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

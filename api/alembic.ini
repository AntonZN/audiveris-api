# Конфиг Alembic для каталога.
#
# sqlalchemy.url здесь НЕ задаётся: env.py подтягивает URL из api.config.settings
# (DATABASE_URL), чтобы был один источник правды с приложением.
#
# Запуск (WORKDIR = /srv): alembic -c api/alembic.ini upgrade head
#                          alembic -c api/alembic.ini revision --autogenerate -m "..."

[alembic]
script_location = api/migrations
prepend_sys_path = .
# Имя ревизии: дата + slug, чтобы файлы версий читались по порядку.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
